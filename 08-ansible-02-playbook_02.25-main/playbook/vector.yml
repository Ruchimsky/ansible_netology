---
- name: Установка и настройка Vector
  hosts: vector-server
  become: yes
  vars:
    vector_config_path: /etc/vector/vector.toml

  tasks:
    - name: Обновить кэш пакетов
      apt:
        update_cache: yes

    - name: Установить snapd если не установлен
      apt:
        name: snapd
        state: present

    - name: Установить Vector через snap
      snap:
        name: vector
        state: present

    - name: Создать директорию для конфигурации
      file:
        path: /etc/vector
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Скопировать конфигурацию Vector через шаблон
      template:
        src: vector.toml.j2
        dest: "{{ vector_config_path }}"
        owner: root
        group: root
        mode: '0644'
      notify: Рестарт Vector

  handlers:
    - name: Рестарт Vector
      systemd:
        name: snap.vector.vector
        state: restarted
        enabled: yes